appId: com.nemoking1210.proxyhub
productName: ProxyHub
copyright: Copyright © 2026 NemoKing1210

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - CHANGELOG.md
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,README.md,DEVELOPER.md,DESIGN.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**

win:
  executableName: ProxyHub
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: ProxyHub needs access to open and save proxy list files.
    NSDownloadsFolderUsageDescription: ProxyHub needs access to import proxy lists from Downloads.
  notarize: false
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  maintainer: NemoKing1210 <nemoking1210@gmail.com>
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-${arch}.${ext}

npmRebuild: false

# releaseType: draft — CI pre-creates an empty draft release before electron-builder
# uploads artifacts. This avoids parallel upload races that create duplicate or
# incomplete releases. The workflow publishes the draft after all builds finish.
publish:
  provider: github
  owner: NemoKing1210
  repo: ProxyHub
  releaseType: draft
